name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Check if version already published
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          set +e
          OUT=$(npm view "$PKG@$VERSION" version 2>&1)
          CODE=$?
          set -e
          if [ $CODE -eq 0 ] && [ -n "$OUT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION already on npm, skipping publish"
          elif [ $CODE -eq 0 ] || echo "$OUT" | grep -q "E404"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm view failed unexpectedly:"
            echo "$OUT"
            exit 1
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
