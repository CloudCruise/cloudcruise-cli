name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # Each package is checked on its own so a re-run after a partial publish
      # picks up where it stopped. strata publishes first: the CLI pins it.
      - name: Check which versions are already published
        id: check
        run: |
          check() {
            local dir=$1 output=$2
            local pkg version out code
            pkg=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            set +e
            out=$(npm view "$pkg@$version" version 2>&1)
            code=$?
            set -e
            if [ $code -eq 0 ] && [ -n "$out" ]; then
              echo "$output=false" >> "$GITHUB_OUTPUT"
              echo "$pkg@$version already on npm, skipping publish"
            elif [ $code -eq 0 ] || echo "$out" | grep -q "E404"; then
              echo "$output=true" >> "$GITHUB_OUTPUT"
            else
              echo "npm view $pkg@$version failed unexpectedly:"
              echo "$out"
              exit 1
            fi
          }
          check packages/core publish_strata
          check . publish
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish @cloudcruise/strata
        if: steps.check.outputs.publish_strata == 'true'
        run: npm publish -w @cloudcruise/strata --access public

      - name: Publish @cloudcruise/cli
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
